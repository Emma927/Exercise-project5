events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    server {
        listen 80;
        server_name localhost;

        # Główny katalog, z którego Nginx serwuje pliki (domyślne miejsce w obrazie Docker Nginx)
        root /usr/share/nginx/html;

        # --- KLUCZOWA KONFIGURACJA DLA REACT ROUTER (SPA) ---
        # Próbuje dopasować żądany URI ($uri) do pliku.
        # Jeśli plik nie istnieje, przekierowuje żądanie do /index.html.
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Opcjonalnie: Nagłówki CORS, jeśli potrzebujesz (odkomentuj jeśli konieczne)
        # add_header Access-Control-Allow-Origin *;
    }
}